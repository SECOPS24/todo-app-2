<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f4f5f7; --card: #ffffff; --text: #1c2330; --muted: #6b7484;
      --line: #e3e6eb; --accent: #2f6fed; --accent-text: #ffffff; --danger: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c; --card: #1e232b; --text: #e8ebf0; --muted: #98a1b0;
        --line: #2e3540; --accent: #5b8ff5; --accent-text: #0e1116; --danger: #ef7a6d;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 40px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      max-width: 560px; margin: 0 auto; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px; padding: 24px;
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    #count { margin: 0 0 20px; color: var(--muted); font-size: 0.9rem; }
    form { display: flex; gap: 8px; margin-bottom: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: inherit;
      background: transparent; border: 1px solid var(--line); border-radius: 8px;
    }
    button { font: inherit; cursor: pointer; border-radius: 8px; }
    button.add { padding: 10px 16px; border: 0; background: var(--accent); color: var(--accent-text); font-weight: 600; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #error { min-height: 1.5em; margin: 0 0 8px; color: var(--danger); font-size: 0.9rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
    li input[type="checkbox"] { width: 18px; height: 18px; flex: none; accent-color: var(--accent); }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    li.done span { color: var(--muted); text-decoration: line-through; }
    button.delete { flex: none; padding: 6px 12px; background: #c0392b; color: #ffffff; border: 0; font-weight: 600; }
    button.delete:hover { background: #a93226; }
    #empty { padding: 24px 0 8px; text-align: center; color: var(--muted); border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <main>
    <h1>Todo App</h1>
    <p id="count" aria-live="polite"></p>
    <form id="add-form">
      <input id="new-todo" type="text" maxlength="200" placeholder="What needs doing?" aria-label="New todo" autocomplete="off" required>
      <button class="add" type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>
    <ul id="list"></ul>
    <p id="empty" hidden>Nothing to do yet. Add your first todo above.</p>
  </main>

  <script>
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    const errorBox = document.getElementById('error');
    const form = document.getElementById('add-form');
    const input = document.getElementById('new-todo');
    let todos = [];

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Something went wrong.');
      return data;
    }

    function render() {
      list.replaceChildren(...todos.map((todo) => {
        const li = document.createElement('li');
        if (todo.done) li.className = 'done';

        const box = document.createElement('input');
        box.type = 'checkbox';
        box.checked = todo.done;
        box.setAttribute('aria-label', 'Mark "' + todo.text + '" as done');
        box.addEventListener('change', () => run(async () => {
          const updated = await api('PATCH', '/api/todos/' + todo.id, { done: box.checked });
          todos = todos.map((t) => (t.id === todo.id ? updated : t));
        }));

        const text = document.createElement('span');
        text.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'delete';
        del.type = 'button';
        del.textContent = 'Delete';
        del.setAttribute('aria-label', 'Delete "' + todo.text + '"');
        del.addEventListener('click', () => run(async () => {
          await api('DELETE', '/api/todos/' + todo.id);
          todos = todos.filter((t) => t.id !== todo.id);
        }));

        li.append(box, text, del);
        return li;
      }));
      empty.hidden = todos.length > 0;
      const left = todos.filter((t) => !t.done).length;
      count.textContent = todos.length === 0 ? '' : left + ' of ' + todos.length + ' left to do';
    }

    async function run(action) {
      errorBox.textContent = '';
      try {
        await action();
      } catch (err) {
        errorBox.textContent = err.message;
        try { todos = await api('GET', '/api/todos'); } catch (_) { /* keep current view */ }
      }
      render();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      run(async () => {
        todos.push(await api('POST', '/api/todos', { text }));
        input.value = '';
        input.focus();
      });
    });

    run(async () => { todos = await api('GET', '/api/todos'); });
  </script>
</body>
</html>
